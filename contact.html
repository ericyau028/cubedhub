<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="聯絡 CubedHub — 有任何問題、建議或合作意向，歡迎與我們聯繫。">
  <meta name="robots" content="index, follow">
  <meta name="google-adsense-account" content="ca-pub-4900630860092971">
  <title>聯絡我們 — CubedHub</title>
  <link rel="canonical" href="https://cubedhub.com/contact.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4900630860092971" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #111127;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }
    html { font-size: 16px; }
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.8;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem; }
    p { color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.95rem; }
    a { color: #818cf8; }
    a:hover { color: #a5b4fc; }
    .nav-back { display: inline-block; margin-bottom: 2rem; color: var(--text-muted); font-size: 0.9rem; text-decoration: none; }
    .nav-back:hover { color: var(--text-primary); }
    /* ===== Navbar (same structure as homepage) ===== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px;
      background: var(--bg-primary);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      transition: box-shadow 0.3s;
    }
    .navbar.scrolled { box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .nav-inner { max-width: 1200px; margin: 0 auto; height: 100%; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 0.6rem; color: var(--text-primary); font-weight: 800; font-size: 1.1rem; text-decoration: none; }
    .nav-logo img { border-radius: 6px; }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; }
    .nav-links a { padding: 0.45rem 0.8rem; color: var(--text-secondary); font-size: 0.88rem; font-weight: 600; text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-cta {
      margin-left: 0.5rem; padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 700; font-size: 0.86rem;
      background: #8B5CF6; color: #fff !important; text-decoration: none;
      transition: transform 0.2s;
    }
    .nav-cta:hover { transform: translateY(-1px); color: #fff !important; }
    .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; flex-direction: column; gap: 5px; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-primary); transition: transform 0.3s, opacity 0.3s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
    .mobile-overlay.open { display: block; }
    .mobile-menu {
      display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 280px; z-index: 101;
      background: var(--bg-primary); padding: 1.5rem; flex-direction: column; gap: 0.25rem;
      transform: translateX(100%); transition: transform 0.3s;
    }
    .mobile-menu.open { transform: translateX(0); }
    .mobile-menu a { padding: 0.8rem 0.5rem; color: var(--text-secondary); font-size: 1rem; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .mobile-menu a:hover { color: var(--text-primary); }
    .mobile-close { align-self: flex-end; background: none; border: none; color: var(--text-secondary); font-size: 1.6rem; cursor: pointer; padding: 0.2rem 0.6rem; }
    .mobile-close:hover { color: var(--text-primary); }
    @media (max-width: 767px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .mobile-menu { display: flex; }
    }
    .contact-card {
      background: var(--bg-secondary);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 2rem;
      margin: 1rem 0;
    }
    .contact-card h2 { font-size: 1rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500; }
    .contact-card .value { font-size: 1.1rem; color: var(--text-primary); }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar" role="navigation" aria-label="主導航">
    <div class="nav-inner">
      <a href="/" class="nav-logo" aria-label="CubedHub 首頁">
        <img src="images/logo.png" alt="CubedHub Logo" width="32" height="32">
        <span>CubedHub</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="/blog/">文章</a>
        <a href="/explore/">全站探索</a>
        <a href="https://tools.cubedhub.com/" target="_blank" rel="noopener">工具</a>
        <a href="/about.html">關於</a>
        <a href="/explore/" class="nav-cta">開始探索</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="開啟選單" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <div class="mobile-menu" id="mobileMenu" role="dialog" aria-label="行動選單">
    <button class="mobile-close" id="mobileClose" aria-label="關閉選單">&times;</button>
    <a href="/blog/">文章</a>
    <a href="/explore/">全站探索</a>
    <a href="https://tools.cubedhub.com/" target="_blank" rel="noopener">工具</a>
    <a href="/about.html">關於</a>
    <a href="/explore/" class="nav-cta" style="text-align:center;margin-top:1rem;">開始探索</a>
  </div>

  <div class="container" style="padding-top: 5.5rem;">
    <h1>聯絡我們</h1>
    <p>如有任何問題、建議、合作意向或隱私相關查詢，歡迎透過以下方式與我們聯繫。我們會盡快回覆。</p>

    <div class="contact-card">
      <h2>電子郵件</h2>
      <div class="value"><a href="mailto:cubedhub@gmail.com">cubedhub@gmail.com</a></div>
    </div>

    <div class="contact-card">
      <h2>更多資訊</h2>
      <div class="value">
        <a href="about.html">關於我們</a> &middot;
        <a href="privacy-policy.html">隱私權政策</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var navbar = document.getElementById('navbar');
      window.addEventListener('scroll', function () {
        navbar.classList.toggle('scrolled', window.scrollY > 10);
      });
      var hamburger = document.getElementById('hamburger');
      var overlay = document.getElementById('mobileOverlay');
      var menu = document.getElementById('mobileMenu');
      var closeBtn = document.getElementById('mobileClose');
      function openMenu() { menu.classList.add('open'); overlay.classList.add('open'); hamburger.classList.add('open'); hamburger.setAttribute('aria-expanded', 'true'); }
      function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); hamburger.classList.remove('open'); hamburger.setAttribute('aria-expanded', 'false'); }
      hamburger.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);
      overlay.addEventListener('click', closeMenu);
    })();
  </script>

</body>
</html>

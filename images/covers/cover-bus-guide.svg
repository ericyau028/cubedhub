    <rect x="-200" y="-90" width="400" height="180" rx="34" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <rect x="-160" y="-60" width="60" height="90" rx="10" fill="#0a0a1a" opacity="0.6"/>
    <rect x="-70" y="-60" width="60" height="90" rx="10" fill="#0a0a1a" opacity="0.6"/>
    <rect x="20" y="-60" width="60" height="90" rx="10" fill="#0a0a1a" opacity="0.6"/>
    <rect x="110" y="-60" width="60" height="90" rx="10" fill="#0a0a1a" opacity="0.6"/>
    <circle cx="-130" cy="-15" r="7" fill="#f1f5f9"/>
    <circle cx="-40" cy="-15" r="7" fill="#f1f5f9"/>
    <circle cx="50" cy="-15" r="7" fill="#f1f5f9"/>
    <circle cx="140" cy="-15" r="7" fill="#f1f5f9"/>
    <circle cx="-130" cy="60" r="26" fill="#0a0a1a"/>
    <circle cx="130" cy="60" r="26" fill="#0a0a1a"/>
    <circle cx="-130" cy="60" r="11" fill="#94a3b8"/>
    <circle cx="130" cy="60" r="11" fill="#94a3b8"/>
  </g>
  <text x="80" y="120" font-family="Noto Sans TC, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9">CubedHub Editorial</text>

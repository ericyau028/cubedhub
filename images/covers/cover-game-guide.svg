    <circle cx="-70" cy="-40" r="12" fill="#0a0a1a"/>
    <circle cx="70" cy="-40" r="12" fill="#0a0a1a"/>
    <path d="M-40 40 L0 10 L40 40" fill="none" stroke="#0a0a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="80" y="120" font-family="Noto Sans TC, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9">CubedHub Editorial</text>
</svg>

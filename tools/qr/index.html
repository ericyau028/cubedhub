  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a1a;
      --bg-card: #111127;
      --bg-input: #1a1a35;
      --border: rgba(255,255,255,0.08);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #8B5CF6;
      --accent-light: #a78bfa;
      --radius: 12px;
    }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 0 1.25rem; width: 100%; }

    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 0;
    }
    .nav-brand {
      font-weight: 700; font-size: 1.1rem; color: #fff;
      display: flex; align-items: center; gap: 0.5rem; text-decoration: none;
    }
    .nav-brand span { background: linear-gradient(135deg, #8B5CF6, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-back { color: var(--text-muted); font-size: 0.85rem; text-decoration: none; }
    .nav-back:hover { color: var(--text-secondary); }

    .hero { text-align: center; padding: 2.5rem 0 1.5rem; }
    .hero h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; }
    .hero p { color: var(--text-secondary); font-size: 0.9rem; max-width: 420px; margin: 0 auto; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .input-group { margin-bottom: 1.25rem; }
    .input-group label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 0.4rem;
    }
    .input-group textarea, .input-group input[type="text"] {
      width: 100%; padding: 0.75rem 1rem;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 0.9rem; font-family: inherit;
      transition: border-color 0.3s; resize: vertical;
    }
    .input-group textarea:focus, .input-group input:focus {
      outline: none; border-color: var(--accent);
    }
    .input-group textarea { min-height: 80px; }

    .options-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .color-input-wrap {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .color-input-wrap input[type="color"] {
      width: 40px; height: 40px; border: none; border-radius: 8px;
      cursor: pointer; background: none; padding: 0;
    }
    .color-input-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-input-wrap input[type="color"]::-webkit-color-swatch { border-radius: 8px; border: 1px solid var(--border); }
    .color-hex {
      font-size: 0.8rem; color: var(--text-muted);
      font-family: monospace;
    }

    .color-presets { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
    .color-preset {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s;
    }
    .color-preset:hover { transform: scale(1.15); }
    .color-preset.active { border-color: #fff; transform: scale(1.15); }

    .size-control { display: flex; align-items: center; gap: 0.75rem; }
    .size-control input[type="range"] {
      flex: 1; height: 4px; appearance: none;
      background: var(--border); border-radius: 2px; outline: none;
    }
    .size-control input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    .size-control .size-label {
      font-size: 0.8rem; color: var(--text-muted); min-width: 36px; text-align: right;
      font-family: monospace;
    }

    .seg-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .seg {
      flex: 1; min-width: 80px; padding: 0.5rem 0.3rem;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-secondary); font-size: 0.75rem;
      cursor: pointer; text-align: center; transition: all 0.2s;
      font-family: inherit;
    }
    .seg.active { background: rgba(139,92,246,0.15); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }

    .logo-upload {
      display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
    }
    .logo-upload input[type="file"] { display: none; }
    .logo-upload .upload-btn {
      padding: 0.5rem 1rem; background: var(--bg-input); border: 1px dashed var(--border);
      border-radius: 8px; color: var(--text-secondary); font-size: 0.8rem;
      cursor: pointer; transition: all 0.2s;
    }
    .logo-upload .upload-btn:hover { border-color: var(--accent); color: var(--accent-light); }
    .logo-preview {
      width: 36px; height: 36px; border-radius: 8px; object-fit: contain;
      background: var(--bg-input); border: 1px solid var(--border); display: none;
    }

    .qr-output {
      display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem; min-height: 260px;
      justify-content: center;
    }
    .qr-output canvas {
      max-width: 100%; height: auto; border-radius: 8px;
    }
    .qr-placeholder {
      color: var(--text-muted); font-size: 0.85rem; text-align: center;
    }
    .qr-placeholder svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.3; }

    .btn-group { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.7rem 1.4rem; border-radius: var(--radius);
      font-size: 0.85rem; font-weight: 600; border: none;
      cursor: pointer; transition: all 0.3s ease; text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8B5CF6, #7c3aed);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(139,92,246,0.3); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary {
      background: rgba(255,255,255,0.06); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

    .footer {
      margin-top: auto; text-align: center;
      padding: 2rem 0; color: var(--text-muted); font-size: 0.8rem;
    }
    .footer a { color: var(--text-muted); }
    .footer a:hover { color: var(--text-secondary); }

    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: #1a1a35; border: 1px solid var(--border);
      padding: 0.7rem 1.4rem; border-radius: 10px; font-size: 0.85rem;
      color: var(--text); opacity: 0; transition: opacity 0.4s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; }

    .section-title {
      font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
      margin: 1rem 0 0.4rem; display: block;
    }

    @media (max-width: 480px) {
      .options-row { grid-template-columns: 1fr; }
      .hero h1 { font-size: 1.3rem; }
      .card { padding: 1.25rem; }
    }
  </style>
</head>
<body>

    <nav class="nav">
      <a href="/" class="nav-brand">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs></svg>
        <span>CubedHub</span>

  <div class="container">
    <div class="hero">
      <h1>QR Code 產生器</h1>

    <div class="card">
      <div class="input-group">
        <label for="qr-input">輸入內容</label>
        <textarea id="qr-input" placeholder="輸入文字或網址..."></textarea>

          <input type="color" id="fg-color" value="#000000">

        <div class="color-presets" id="fg-presets"></div>

    <div class="card">
      <div class="qr-output" id="qr-output">
        <div class="qr-placeholder" id="qr-placeholder">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
          <p>輸入內容後按「產生 QR Code」</p>
        </div>
        <canvas id="qr-canvas" style="display:none"></canvas>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="generate-btn">產生 QR Code</button>

    <div style="text-align:center;padding:0.5rem 0 1.5rem;color:var(--text-muted);font-size:0.75rem;">— 廣告 —</div>

  <footer class="footer">
    <div class="container">
      <p><a href="/privacy-policy.html">隱私權政策</a> &middot; <a href="/contact.html">聯絡我們</a></p>
      <p style="margin-top:0.3rem;">&copy; 2026 cubedhub.com</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    (function(){
      var input = document.getElementById('qr-input');
      var generateBtn = document.getElementById('generate-btn');
      var downloadBtn = document.getElementById('download-btn');
      var canvas = document.getElementById('qr-canvas');
      var qrPlaceholder = document.getElementById('qr-placeholder');
      var fgColor = document.getElementById('fg-color');
      var bgColor = document.getElementById('bg-color');
      var fgHex = document.getElementById('fg-hex');
      var bgHex = document.getElementById('bg-hex');
      var qrSize = document.getElementById('qr-size');
      var sizeLabel = document.getElementById('size-label');
      var toast = document.getElementById('toast');
      var logoFile = document.getElementById('logo-file');
      var logoBtn = document.getElementById('logo-btn');
      var logoPreview = document.getElementById('logo-preview');
      var logoClear = document.getElementById('logo-clear');
      var lastDataUrl = '';
      var logoDataUrl = '';
      var styleMode = 'square';
      var borderEnabled = 1;

      var COLOR_PRESETS = ['#000000', '#1a1a1a', '#8B5CF6', '#2563EB', '#16A34A', '#DC2626', '#D97706', '#06B6D4', '#DB2777'];

      // Build color presets
      var fgPresets = document.getElementById('fg-presets');
      COLOR_PRESETS.forEach(function(c, i){
        var el = document.createElement('div');
        el.className = 'color-preset' + (i === 0 ? ' active' : '');
        el.style.background = c;
        el.title = c;
        el.addEventListener('click', function(){
          fgColor.value = c;
          fgHex.textContent = c;
          document.querySelectorAll('.color-preset').forEach(function(p){ p.classList.remove('active'); });
          el.classList.add('active');
        });
        fgPresets.appendChild(el);
      });

      // Load saved preferences
      var saved = localStorage.getItem('qr_prefs');
      if (saved) {
        try {
          var prefs = JSON.parse(saved);
          if (prefs.fg) fgColor.value = prefs.fg;
          if (prefs.bg) bgColor.value = prefs.bg;
          if (prefs.size) qrSize.value = prefs.size;
          if (prefs.style) styleMode = prefs.style;
          if (prefs.border !== undefined) borderEnabled = prefs.border;
        } catch(e) {}
      }
      fgHex.textContent = fgColor.value;
      bgHex.textContent = bgColor.value;
      sizeLabel.textContent = qrSize.value;
      document.querySelectorAll('.seg[data-style]').forEach(function(btn){
        if (btn.dataset.style === styleMode) {
          document.querySelectorAll('.seg[data-style]').forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
        }
      });
      document.querySelectorAll('.seg[data-border]').forEach(function(btn){
        if (parseInt(btn.dataset.border) === borderEnabled) {
          document.querySelectorAll('.seg[data-border]').forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
        }
      });

      fgColor.addEventListener('input', function(){ fgHex.textContent = fgColor.value; });
      bgColor.addEventListener('input', function(){ bgHex.textContent = bgColor.value; });
      qrSize.addEventListener('input', function(){ sizeLabel.textContent = qrSize.value; });

      document.querySelectorAll('.seg[data-style]').forEach(function(btn){
        btn.addEventListener('click', function(){
          document.querySelectorAll('.seg[data-style]').forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          styleMode = btn.dataset.style;
        });
      });
      document.querySelectorAll('.seg[data-border]').forEach(function(btn){
        btn.addEventListener('click', function(){
          document.querySelectorAll('.seg[data-border]').forEach(function(b){ b.classList.remove('active'); });
          btn.classList.add('active');
          borderEnabled = parseInt(btn.dataset.border);
        });
      });

      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
      });

      logoBtn.addEventListener('click', function(){ logoFile.click(); });
      logoClear.addEventListener('click', function(){
        logoDataUrl = '';
        logoFile.value = '';
        logoPreview.style.display = 'none';
        logoClear.style.display = 'none';
      });
      logoFile.addEventListener('change', function(){
        var file = logoFile.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          logoDataUrl = ev.target.result;
          logoPreview.src = logoDataUrl;
          logoPreview.style.display = 'block';
          logoClear.style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
      });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function(){ toast.classList.remove('show'); }, 2500);
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function generate() {
        var text = input.value.trim();
        if (!text) { showToast('請輸入文字或網址'); return; }

        var fg = fgColor.value;
        var bg = bgColor.value;
        var size = parseInt(qrSize.value);
        var errorLevel = logoDataUrl ? 'H' : 'M';

        var qr;
        try {
          qr = qrcode(0, errorLevel);
          qr.addData(text);
          qr.make();
        } catch(e) {
          showToast('內容太長，無法產生 QR Code');
          return;
        }

        var count = qr.getModuleCount();
        var quiet = borderEnabled ? 4 : 0;
        var moduleCount = count + quiet * 2;
        var moduleSize = size / moduleCount;

        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, size, size);

        ctx.fillStyle = fg;

        var radiusFactor = 0.5; // rounded style radius relative to module size
        var gap = 0;

        if (styleMode === 'dots') {
          gap = moduleSize * 0.15;
          radiusFactor = 0.5;
        } else if (styleMode === 'rounded') {
          radiusFactor = 0.5;
        } else if (styleMode === 'classy') {
          radiusFactor = 0.3;
        }

        function drawModule(row, col) {
          var x = (col + quiet) * moduleSize;
          var y = (row + quiet) * moduleSize;
          var w = moduleSize - gap * 2;
          var h = moduleSize - gap * 2;
          var cx = x + gap;
          var cy = y + gap;

          if (styleMode === 'square') {
            ctx.fillRect(cx, cy, w, h);
          } else {
            roundRect(ctx, cx, cy, w, h, moduleSize * radiusFactor);
            ctx.fill();
          }
        }

        // Draw finder patterns (corner squares) fully square for scannability
        function drawFinder(row0, col0) {
          var o = quiet;
          var ms = moduleSize;
          // Outer 7x7 dark
          ctx.fillRect((col0 + o) * ms, (row0 + o) * ms, ms * 7, ms * 7);
          // Inner 5x5 white
          ctx.fillStyle = bg;
          ctx.fillRect((col0 + o + 1) * ms, (row0 + o + 1) * ms, ms * 5, ms * 5);
          // Inner 3x3 dark
          ctx.fillStyle = fg;
          ctx.fillRect((col0 + o + 2) * ms, (row0 + o + 2) * ms, ms * 3, ms * 3);
        }

        var finders = [[0,0],[0,count-7],[count-7,0]];
        // Draw all non-finder modules first
        for (var row = 0; row < count; row++) {
          for (var col = 0; col < count; col++) {
            var inFinder = finders.some(function(f){
              return row >= f[0] && row < f[0]+7 && col >= f[1] && col < f[1]+7;
            });
            if (!inFinder && qr.isDark(row, col)) {
              drawModule(row, col);
            }
          }
        }

        // Draw finders on top (solid for scannability)
        drawFinder(0, 0);
        drawFinder(0, count-7);
        drawFinder(count-7, 0);

        // Logo overlay
        if (logoDataUrl) {
          var logoSize = size * 0.22;
          var logoX = (size - logoSize) / 2;
          var logoY = (size - logoSize) / 2;
          // White padding background
          ctx.fillStyle = '#ffffff';
          roundRect(ctx, logoX - size*0.02, logoY - size*0.02, logoSize + size*0.04, logoSize + size*0.04, 8);
          ctx.fill();
          var logoImg = new Image();
          logoImg.onload = function(){
            ctx.save();
            ctx.beginPath();
            roundRect(ctx, logoX, logoY, logoSize, logoSize, 6);
            ctx.clip();
            ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
            ctx.restore();
            finalize();
          };
          logoImg.onerror = function(){ finalize(); };
          logoImg.src = logoDataUrl;
        } else {
          finalize();
        }

        function finalize() {
          lastDataUrl = canvas.toDataURL('image/png');
          canvas.style.display = 'block';
          qrPlaceholder.style.display = 'none';
          downloadBtn.disabled = false;
          localStorage.setItem('qr_prefs', JSON.stringify({ fg: fgColor.value, bg: bgColor.value, size: size, style: styleMode, border: borderEnabled }));
        }

        if (!logoDataUrl) {
          lastDataUrl = canvas.toDataURL('image/png');
          canvas.style.display = 'block';
          qrPlaceholder.style.display = 'none';
          downloadBtn.disabled = false;
          localStorage.setItem('qr_prefs', JSON.stringify({ fg: fgColor.value, bg: bgColor.value, size: size, style: styleMode, border: borderEnabled }));
        }
      }

      function download() {
        if (!lastDataUrl) return;
        var a = document.createElement('a');
        a.href = lastDataUrl;
        a.download = 'qrcode.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('已下載 QR Code');
      }

      generateBtn.addEventListener('click', generate);
      downloadBtn.addEventListener('click', download);

      var savedText = localStorage.getItem('qr_text');
      if (savedText) {
        input.value = savedText;
        generate();
      }
      input.addEventListener('input', function(){
        localStorage.setItem('qr_text', input.value);
      });
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
